name: Spotter
options:
  bundleIdPrefix: com.spotter
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.7.39"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Q9MD524YL5
    CODE_SIGN_STYLE: Manual
    # Debug signs with the same Developer ID as releases, so TCC grants (Full Disk Access,
    # Accessibility, Input Monitoring) survive dev↔stable swaps — macOS keys them to the signing
    # identity, and flipping identities resets every grant. On a machine without the Developer ID
    # certificate, fall back to the self-signed identity — see docs/signing.md.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      # Dev and stable share one base version; only the locally installed build gets the suffix.
      SPOTTER_VERSION_SUFFIX: "-dev"
    Release:
      # Public releases use the personal Developer ID so Gatekeeper and notarization accept them.
      DEVELOPMENT_TEAM: Q9MD524YL5
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Spotter:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Build Local Embedding Helper
        script: 'bash "$SRCROOT/scripts/build-semantic-helper.sh"'
        basedOnDependencyAnalysis: false
    sources:
      - path: Spotter
        excludes:
          - spotter.icon
          - Resources/AIChatMarkdown
          - Resources/SemanticSearchLicenses
      # Icon Composer bundles are directories. Left to itself XcodeGen walks into this one and
      # copies `icon.json` and `thunder.svg` loose into Resources, so `actool` never compiles the
      # icon and the app ships with none. `type: file` keeps it a single reference for the
      # resources phase, which is what `ASSETCATALOG_COMPILER_APPICON_NAME: spotter` resolves.
      - path: Spotter/Resources/AIChatMarkdown
        type: folder
        buildPhase: resources
      - path: Spotter/Resources/SemanticSearchLicenses
        type: folder
        buildPhase: resources
      - path: Spotter/spotter.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotter.app1
        INFOPLIST_FILE: Spotter/Info.plist
        CODE_SIGN_ENTITLEMENTS: Spotter/Spotter.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: spotter
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Spotter/Spotter.Release.entitlements
      # Debug deliberately shares the stable product name and bundle id: every local build is
      # installed as /Applications/Spotter.app (AGENTS.md local-build contract), so it keeps the
      # installed app's prefs, caches, TCC grants and login item.

  # The iOS app carries Notes only. It compiles the same Foundation-only Notes sources as the Mac
  # target — never a copy — so the file format, merge and reconciliation are one implementation.
  SpotterNotes:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: SpotterNotes
      - path: Spotter/Plugins/Note/NoteEngine.swift
      - path: Spotter/Plugins/Note/NoteSyncDocument.swift
      - path: Spotter/Plugins/Note/NoteFolderDocument.swift
      - path: Spotter/Plugins/Note/NoteStore.swift
      - path: Spotter/Plugins/Note/NoteFolderIO.swift
      - path: Spotter/Plugins/Note/NoteFolderSyncManager.swift
      - path: Spotter/Core/AppLog.swift
      - path: Spotter/Core/Backup/SettingsSyncFile.swift
      # The editor answers `12+3=` through the same pure calculator the Mac editor uses.
      - path: Spotter/Core/Calculator
      - path: Spotter/Plugins/CurrencyConversion/CalcCurrency.swift
      - path: Spotter/Plugins/CurrencyConversion/CurrencyData.generated.swift
      - path: Spotter/spotter.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotter.app1.ios
        INFOPLIST_FILE: SpotterNotes/Info.plist
        # TestFlight build numbers move on their own; the marketing version stays the project's.
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: spotter
        # The project signs manually with Developer ID, which cannot sign an iOS app; none of the
        # Mac release signing settings may reach this target in either configuration.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: Q9MD524YL5
        OTHER_CODE_SIGN_FLAGS: ""
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
