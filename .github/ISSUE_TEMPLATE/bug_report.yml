name: Bug Report
description: Report a bug running Spotter
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: |
        What you did, what you expected, what you got instead.
        A short recording beats a paragraph.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spotter version + channel
      placeholder: 0.1.0 · stable
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
