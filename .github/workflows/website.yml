name: Website

# Builds the Vite site in website/ and deploys it to GitHub Pages at
# https://mmmmmmarcus.github.io/Spotter/. Requires: repo Settings → Pages →
# Source = "GitHub Actions" (one-time setup).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "scripts/generate-update-feed.py"
  workflow_dispatch:
  workflow_call:
    inputs:
      expected-tag:
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one Pages deploy at a time, but never cancel an in-progress one:
# cancelling a live deploy-pages run corrupts the deployment and the next run
# fails with "Deployment failed, try again later". Queued runs coalesce instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate static update feeds from published releases
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/generate-update-feed.py --output website/public/updates --expected "$EXPECTED_TAG"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 10
          done
      - name: Install & build
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-audit
      - name: Verify public feeds match the deployed artifact
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          tar -xf "$RUNNER_TEMP/pages-audit/artifact.tar" -C "$RUNNER_TEMP/pages-audit"
          for channel in stable beta; do
            verified=false
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --location --retry 2 \
                "${PAGES_URL%/}/updates/$channel.json?deployment=$GITHUB_RUN_ID" \
                -o "$RUNNER_TEMP/$channel.json" && \
                cmp "$RUNNER_TEMP/$channel.json" "$RUNNER_TEMP/pages-audit/updates/$channel.json"; then
                verified=true
                break
              fi
              sleep 10
            done
            if [ "$verified" != true ]; then exit 1; fi
          done
